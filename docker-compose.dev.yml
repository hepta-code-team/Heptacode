services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    working_dir: /workspace/frontend
    ports: 
      - "5173:5173"
    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_FACILITY_DATA_PROVIDER=auto
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile.dev
    working_dir: /workspace/backend
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - .:/workspace
      - /workspace/backend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env.local
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
